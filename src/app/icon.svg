<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <!-- Isometric 3D Cargo Container for DVPS -->
  <!-- Top Face (Highlighted) -->
  <path d="M16 5 L26 10.5 L16 16 L6 10.5 Z" fill="#38bdf8"/>
  <!-- Left Face (Midtone) -->
  <path d="M6 10.5 L16 16 L16 26.5 L6 21 Z" fill="#0284c7"/>
  <!-- Right Face (Deep Shadow) -->
  <path d="M16 16 L26 10.5 L26 21 L16 26.5 Z" fill="#0369a1"/>
  <!-- Structural Bevel / Seam Edges -->
  <path d="M16 5 L16 16" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>
  <path d="M6 10.5 L16 16" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.3"/>
  <path d="M26 10.5 L16 16" stroke="#000000" stroke-width="0.6" stroke-opacity="0.3"/>
  <path d="M16 16 L16 26.5" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4"/>
  <!-- Apex Corner Pin -->
  <circle cx="16" cy="16" r="1.2" fill="#ffffff"/>
</svg>
